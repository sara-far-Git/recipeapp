services:
  # ===========================
  # PostgreSQL Database
  # ===========================
  db:
    image: postgres:16-alpine
    container_name: recipeapp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================
  # pgAdmin (Local Dev UI)
  # ===========================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: recipeapp_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ===========================
  # FastAPI Backend
  # ===========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recipeapp_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_RECIPE_MODEL: ${OPENAI_RECIPE_MODEL:-gpt-4o-mini}
      # Local default. Set GEMMA_BASE_URL explicitly for a remote provider.
      AI_PREFILTER_ENABLED: ${AI_PREFILTER_ENABLED:-false}
      GEMMA_BASE_URL: ${GEMMA_BASE_URL:-http://host.docker.internal:11434/v1}
      GEMMA_API_KEY: ${GEMMA_API_KEY:-local}
      GEMMA_MODEL: ${GEMMA_MODEL:-gemma3:4b}
      AI_PREFILTER_CONFIDENCE_THRESHOLD: ${AI_PREFILTER_CONFIDENCE_THRESHOLD:-0.85}
      AI_PREFILTER_MAX_INPUT_CHARS: ${AI_PREFILTER_MAX_INPUT_CHARS:-16000}
      AI_PREFILTER_MAX_FALLBACK_CHARS: ${AI_PREFILTER_MAX_FALLBACK_CHARS:-5000}
      GEMMA_WARM_WINDOW_SECONDS: ${GEMMA_WARM_WINDOW_SECONDS:-50}
      GEMMA_WARM_REQUEST_TIMEOUT_SECONDS: ${GEMMA_WARM_REQUEST_TIMEOUT_SECONDS:-15}
      GEMMA_ASSUME_WARM: ${GEMMA_ASSUME_WARM:-false}
      DEBUG: ${DEBUG}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ===========================
  # Next.js Frontend
  # ===========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recipeapp_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  pgadmin_data:
